{% extends "home/base.html" %}
{% block title %}Checkout - ThreadShop{% endblock %}
{% block extra_js %}<script src="{{ url_for('static', filename='js/features/home/checkout.js') }}"></script>{% endblock %}
{% block content %}
<div class="container container--sm">
  <div class="page-header"><h1>Checkout</h1><p>Review your order and choose a payment method.</p></div>
  {% include "home/components/order_summary.html" %}
  <form action="{{ url_for('checkout.checkout_submit') }}" method="POST" class="checkout-form" id="checkoutForm">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-section"><h3>Payment Method</h3>
      <label><input type="radio" name="payment_method" value="CASH" required checked> Cash (pay instantly for testing)</label>
      <label><input type="radio" name="payment_method" value="BAKONG" required> Bakong KHQR</label>
    </div>
    <p role="status" id="checkoutStatus"></p>
    <button type="submit" class="btn btn--primary btn--lg">Place Order</button>
    <a href="{{ url_for('cart.cart_page') }}" class="btn btn--outline">Back to Cart</a>
  </form>
</div>
{% endblock %}
