<div class="product-grid">
	{% for product in products %}
	<div class="product-card">
		<a href="{{ url_for('products.product_detail', product_id=product.id) }}" class="product-card__img-wrap">
			<img src="{{ product.imageUrl }}" alt="{{ product.name }}"
				onerror="this.src='https://placehold.co/400x400?text=No+Image'">
		</a>
		<div class="product-card__body">
			<a href="{{ url_for('products.product_detail', product_id=product.id) }}" class="product-card__name">
				{{ product.name }}
			</a>
			<div class="product-card__footer">
				<span class="product-card__price">{{ format_price(product.priceCents) }}</span>
				<form action="{{ url_for('cart.cart_add') }}" method="POST" class="product-card__form">
					<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
					<input type="hidden" name="product_id" value="{{ product.id }}">
					<div class="card-qty">
						<button type="button" class="card-qty__btn card-qty__btn--minus"
							aria-label="Decrease quantity">−
						</button>
						<input type="number" name="qty" class="card-qty__input" value="1" min="1" max="{{ product.stock }}" readonly>
						<button type="button" class="card-qty__btn card-qty__btn--plus" aria-label="Increase quantity">+
						</button>
					</div>
					<button type="submit" class="btn btn--primary btn--sm product-card__btn" {{ "disabled" if product.stock < 1 }}>{{ "Add" if product.stock > 0 else "Out of Stock" }}</button>
				</form>
			</div>
		</div>
	</div>
	{% else %}<p>No products available yet.</p>
	{% endfor %}
</div>
