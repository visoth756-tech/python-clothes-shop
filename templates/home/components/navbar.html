<nav class="navbar">
    <div class="navbar__container">
        <a href="{{ url_for('main.index') }}" class="navbar__brand">ThreadShop</a>

        <button class="navbar__toggle" id="navToggle" aria-label="Toggle menu">
            <span></span><span></span><span></span>
        </button>

        <ul class="navbar__links" id="navLinks">
            <li><a href="{{ url_for('main.index') }}" class="{{ 'active' if request.endpoint == 'main.index' }}">Home</a></li>
            <li><a href="{{ url_for('products.products_page') }}" class="{{ 'active' if request.endpoint == 'products.products_page' }}">Shop</a></li>
            <li><a href="{{ url_for('orders.orders') }}" class="{{ 'active' if request.endpoint == 'orders.orders' }}">Orders</a></li>
        </ul>

        <a href="{{ url_for('cart.cart_page') }}" class="navbar__cart">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
            </svg>
            {% if cart_count > 0 %}
            <span class="navbar__cart-badge" id="cartBadge">{{ cart_count }}</span>
            {% else %}
            <span class="navbar__cart-badge navbar__cart-badge--hidden" id="cartBadge">0</span>
            {% endif %}
        </a>
    </div>
</nav>
