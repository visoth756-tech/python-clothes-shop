<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="csrf-token" content="{{ csrf_token() }}">
	<title>{% block title %}ThreadShop{% endblock %}</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
	<link rel="stylesheet" href="{{ url_for('static', filename='css/home/style.css') }}">
	<link rel="stylesheet" href="{{ url_for('static', filename='css/home/navbar.css') }}">
	<link rel="stylesheet" href="{{ url_for('static', filename='css/home/footer.css') }}">
	<link rel="stylesheet" href="{{ url_for('static', filename='css/shared/toast.css') }}">
	{% block extra_css %}{% endblock %}
</head>
<body>

{% include "home/components/navbar.html" %}

<main class="main-content">
	{% include "home/components/flash.html" %}
	{% block content %}{% endblock %}
</main>

{% include "home/components/footer.html" %}
{% include "layouts/data.html" %}

<script src="{{ url_for('static', filename='js/shared/toast.js') }}"></script>
<script src="{{ url_for('static', filename='js/features/home/bootstrap.js') }}"></script>
<script src="{{ url_for('static', filename='js/features/home/navbar.js') }}"></script>
<script type="module" src="{{ url_for('static', filename='js/features/home/cart/cartAdd.js') }}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
