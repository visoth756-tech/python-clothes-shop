<div id="deleteModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center">
  <div class="bg-white rounded-lg p-6 w-full max-w-md">

    <h2 class="text-lg font-semibold mb-2">
      Delete <span id="deleteItemName">this item</span>
    </h2>

    <p class="text-sm text-stone-600">
      Are you sure you want to delete
      <span id="deleteName" class="font-semibold text-stone-900">this item</span>?
      This cannot be undone.
    </p>

    <div class="flex justify-end gap-2 mt-5">
      <button
        type="button"
        onclick="closeDeleteModal()"
        class="px-4 py-2 border border-stone-300 rounded-md cursor-pointer hover:bg-stone-50"
      >
        Cancel
      </button>

      <button
        type="button"
        onclick="confirmDelete()"
        class="px-4 py-2 bg-red-600 text-white rounded-md cursor-pointer hover:bg-red-700"
      >
        Delete
      </button>
    </div>

  </div>
</div>
