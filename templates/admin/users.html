<!DOCTYPE html>
<html lang="en">

<head>
	{% include "layouts/head.html" %}
</head>

<body class="bg-paper text-ink">

<div class="flex h-screen overflow-hidden">

	<!-- SIDEBAR -->
	<aside id="sidebarNav"></aside>

	<!-- MAIN -->
	<div class="flex-1 flex flex-col overflow-hidden">

		<!-- TOPBAR -->
		<header id="pageHeader"></header>

		<!-- CONTENT -->
		<main class="flex-1 overflow-y-auto p-7" id="table">
			<!-- injected by JS -->
		</main>
	</div>
</div>

<!-- MODAL: Add/Edit -->
<div id="formModel" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center">r">
	<div class="bg-white rounded-lg p-6 w-full max-w-md">
		<h2 id="popupTitle" class="text-lg font-semibold mb-4"></h2>

		<form id="loginForm" class="flex flex-col gap-4">

			<!-- Image -->
			<div>
				<label class="block text-sm font-medium text-stone-700 mb-1">
					Profile Image
				</label>

				<div class="relative w-28 h-28">
					<img
						id="imagePreview"
						src="" alt=""
						class="hidden w-28 h-28 object-cover rounded-md border border-stone-300"
					>

					<label
						for="inputImage"
						id="imagePlaceholder"
						class="w-28 h-28 border-2 border-dashed border-stone-300 rounded-md flex flex-col items-center justify-center cursor-pointer hover:bg-stone-50"
					>
						<i class="fa-solid fa-image text-2xl text-stone-400"></i>
						<span class="text-xs text-stone-500 mt-1">Choose image</span>
					</label>

					<input
						id="inputImage"
						name="image"
						type="file"
						accept="image/*"
						class="hidden"
					>

					<!-- Replace image -->
					<label
						for="inputImage"
						id="replaceImage"
						class="hidden absolute bottom-1 right-1 w-8 h-8 bg-black text-white rounded-full flex items-center justify-center cursor-pointer hover:bg-stone-800"
						title="Replace image"
					>
						<i class="fa-solid fa-pen text-xs"></i>
					</label>
				</div>
			</div>

			<!-- Username -->
			<div>
				<label for="inputUsername" class="block text-sm font-medium text-stone-700 mb-1">
					Username *
				</label>

				<input
					id="inputUsername"
					name="username"
					type="text"
					required
					class="w-full border border-stone-300 rounded-md px-3 py-2 text-sm"
				>
			</div>

			<!-- Password -->
			<div>
				<label for="inputPassword" class="block text-sm font-medium text-stone-700 mb-1">
					Password *
				</label>

				<input
					id="inputPassword"
					name="password"
					type="password"
					class="w-full border border-stone-300 rounded-md px-3 py-2 text-sm"
				>
			</div>

			<!-- Role & Status -->
			<div class="flex">
				<div class="flex-1 me-2">
					<label for="role" class="block text-sm font-medium text-stone-700 mb-1">
						Role *
					</label>

					<select
						id="role"
						name="role"
						required
						class="w-full border border-stone-300 rounded-md px-3 py-2 text-sm bg-white"
					>
						<option value="" disabled selected>Select role</option>
						<option value="USER">User</option>
						<option value="ADMIN">Admin</option>
					</select>
				</div>

				<div>
					<label for="status" class="block text-sm font-medium text-stone-700 mb-1">
						Status *
					</label>

					<select
						id="status"
						name="status"
						required
						class="w-full border border-stone-300 rounded-md px-3 py-2 text-sm bg-white"
					>
						<option value="" disabled selected>Select status</option>
						<option value="ACTIVE">Active</option>
						<option value="INACTIVE">Inactive</option>
					</select>
				</div>
			</div>

			<!-- Buttons -->
			<div class="flex justify-end gap-2 mt-5">
				<button
					type="button"
					onclick="closeModal()"
					class="px-4 py-2 border rounded-md cursor-pointer hover:bg-stone-50"
				>
					Cancel
				</button>

				<button
					type="submit"
					class="px-4 py-2 bg-black text-white rounded-md cursor-pointer hover:bg-stone-800"
				>
					Save
				</button>
			</div>

		</form>
	</div>
</div>

<!-- MODAL: Delete -->
{% include "layouts/delete_model.html" %}

{% include "layouts/data.html" %}

<script type="module" src="{{ url_for('static', filename='js/admin/user.js') }}"></script>

</body>

</html>
