<!DOCTYPE html>
<html lang="en">
<head>
	{% include "layouts/head.html" %}
</head>

<body class="bg-paper text-ink">

<div class="flex h-screen overflow-hidden">

	<!-- SIDEBAR -->
	<aside id="sidebarNav"></aside>

	<!-- MAIN -->
	<div class="flex-1 flex flex-col overflow-hidden">

		<!-- TOPBAR -->
		<header id="pageHeader"></header>

		<main class="flex-1 overflow-y-auto p-7">
			<div class="bg-white border border-stone-200 rounded-lg overflow-hidden">

						<!-- Header -->
						<div class="grid grid-cols-[0.5fr_1.5fr_1fr_1fr_1fr] bg-stone-50 border-b border-stone-200">

							<div class="px-5 py-3 text-xs font-mono uppercase tracking-wide">
								Name
							</div>

							<div class="px-5 py-3 text-xs font-mono uppercase tracking-wide">
								Products
							</div>

							<div class="px-5 py-3 text-xs font-mono uppercase tracking-wide">
								Create At
							</div>

							<div class="px-5 py-3 text-xs font-mono uppercase tracking-wide">
								Update At
							</div>

							<div class="px-5 py-3 text-xs font-mono uppercase tracking-wide text-right">
								Actions
							</div>

						</div>
						<div id="categoryList"></div>

			</div>

			<p class="text-xs text-stone-400 mt-3 font-mono">
				<span id="categoryCount">0</span>
				record<span id="recordPlural">s</span>
			</p>
		</main>
	</div>
</div>

<!-- MODAL: Add/Edit -->
<div id="categoryModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center">
	<div class="bg-white rounded-lg p-6 w-full max-w-md">
		<div class="popup-heading"><h2 id="popupTitle" class="text-lg font-semibold mb-4"></h2><button type="button" data-popup-close class="popup-close" aria-label="Close category popup">&times;</button></div>
        <p data-popup-error class="popup-error" role="alert" tabindex="-1" hidden></p>

		<form id="categoryForm">
			<!-- CSRF token -->
			<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

			<div>
				<label for="categoryName" class="block text-sm font-medium text-stone-700 mb-1">Name *</label>

				<input id="categoryName" name="name" type="text" required
							 class="w-full border border-stone-300 rounded-md px-3 py-2 text-sm"/>
			</div>

			<div class="flex justify-end gap-2 mt-5">
				<button type="button" onclick="closeCategoryModal()" class="px-4 py-2 border rounded-md">
					Cancel
				</button>

				<button type="submit" class="px-4 py-2 bg-black text-white rounded-md">
					Save
				</button>
			</div>
		</form>
	</div>
</div>

{% include "layouts/delete_model.html" %}

{% include "layouts/data.html" %}

<script src="{{ url_for('static', filename='js/shared/toast.js') }}"></script>
<script type="module" src="{{ url_for('static', filename='js/features/admin/category/page.js') }}"></script>
</body>
</html>
